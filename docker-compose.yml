x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: pim-pf-airflow:1.0
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Todo usuário é administrador: adequado à avaliação local, não à produção.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    # A DAG aciona a ingestão por aqui.
    PIM_API_URL: http://ingestao:8000
    # Repassadas ao contêiner do dbt pelo DockerOperator.
    PIM_DB_HOST: postgres
    PIM_DB_PORTA: "5432"
    PIM_DB_NOME: ${POSTGRES_DB}
    PIM_DB_USUARIO: ${POSTGRES_USER}
    PIM_DB_SENHA: ${POSTGRES_PASSWORD}
  volumes:
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  networks: [pim_pf_rede]

services:
  postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PIM_LEITURA_SENHA: ${PIM_LEITURA_SENHA}
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql/top3_por_uf_mes.sql:/sql/top3_por_uf_mes.sql:ro
    ports:
      # Só na própria máquina: consultas SQL e Power BI.
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pim_pf_rede]

  # API e extração. É o único ponto de entrada da ingestão.
  ingestao:
    build:
      context: .
      dockerfile: docker/ingestao/Dockerfile
    image: pim-pf-ingestao:1.0
    restart: unless-stopped
    environment:
      PIM_DB_HOST: postgres
      PIM_DB_PORTA: "5432"
      PIM_DB_NOME: ${POSTGRES_DB}
      PIM_DB_USUARIO: ${POSTGRES_USER}
      PIM_DB_SENHA: ${POSTGRES_PASSWORD}
      PIM_DIR_BRUTOS: /app/data/raw
    volumes:
      - dados_brutos:/app/data
    ports:
      # A API não tem autenticação, então só a própria máquina a alcança.
      - "127.0.0.1:${INGESTAO_PORTA:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [pim_pf_rede]

  # Confere a instalação e encerra. Serve para construir a imagem que o DockerOperator executa.
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    image: pim-pf-dbt:1.0
    restart: "no"
    command: ["dbt", "--version"]
    environment:
      PIM_DB_HOST: postgres
      PIM_DB_PORTA: "5432"
      PIM_DB_NOME: ${POSTGRES_DB}
      PIM_DB_USUARIO: ${POSTGRES_USER}
      PIM_DB_SENHA: ${POSTGRES_PASSWORD}
    networks: [pim_pf_rede]

  # Prepara o banco do Airflow e encerra.
  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORTA:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    volumes:
      - airflow_logs:/opt/airflow/logs
      # Só aqui: com o LocalExecutor, as tarefas rodam neste contêiner. Quem acessa o socket
      # controla o Docker da máquina, e o risco está registrado no ADR 0012.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      ingestao:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]

volumes:
  postgres_dados:
  dados_brutos:
  airflow_logs:

networks:
  # Nome fixo porque o DockerOperator entra nesta rede pelo nome.
  pim_pf_rede:
    name: pim_pf_rede
