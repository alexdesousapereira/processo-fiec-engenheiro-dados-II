<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',system-ui,Inter,sans-serif">
  <!--
    VARIANTE: BARRA DE MENU NO TOPO (abas, estilo ex.14) + 4 KPIs + 2 linhas (wide + 2). GRID PADRÃO (margem 24, gutter 20).
    Top bar 0..56. Zonas deslocadas p/ baixo: título 56..120 · KPIs y130 h88 · corpo y238/y474 h216.
    KPIs (4): w293, x = 24 / 337 / 650 / 963.  Corpo wide w606 (x24) + 2 de w293 (x650 / x963).
    Cor de ação: #4E7CFF. Ícones Material inline no-->

  <g id="fundo">
    <rect width="1280" height="720" fill="#F5F7FB"/>
  </g>

  <!-- BARRA DE MENU NO TOPO -->
