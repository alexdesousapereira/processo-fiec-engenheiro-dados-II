      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-1" transform="translate(650,238)">
      <rect width="293" height="216" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-2" transform="translate(963,238)">
      <rect width="293" height="216" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <!-- CORPO linha 2 (y474) -->
    <g id="visual-3" transform="translate(24,474)">
      <rect width="606" height="216" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-4" transform="translate(650,474)">
      <rect width="293" height="216" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-5" transform="translate(963,474)">
      <rect width="293" height="216" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
  </g>

  <!-- RODAPÉ -->
  <g id="rodape">
    <text x="24" y="708" font-size="11" fill="#7C8595">Fonte: {{FONTE}}</text>
    <text x="1256" y="708" text-anchor="end" font-size="11" fill="#C9CDD4">MOCKUP — dados ilustrativos</text>
  </g>
  </svg>
