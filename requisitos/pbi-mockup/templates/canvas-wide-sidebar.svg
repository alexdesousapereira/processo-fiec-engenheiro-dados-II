    <g id="visual-3" transform="translate(264,454)"><rect width="650" height="218" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/><text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text><text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text></g>
    <g id="visual-4" transform="translate(934,454)"><rect width="322" height="218" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/><text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text><text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text></g>
