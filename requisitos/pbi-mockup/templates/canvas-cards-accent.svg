    <text x="48" y="40" font-size="18" font-weight="600" fill="#FFFFFF">{{AREA}} — {{ASSUNTO}}</text>
    <text x="48" y="60" font-size="12" fill="#AEB6C6">Dados: <tspan font-weight="600" fill="#FFFFFF">{{DATA_REFERENCIA}}</tspan> · {{DATA_ATUALIZACAO}}</text>
