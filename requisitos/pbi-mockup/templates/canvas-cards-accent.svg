    <g id="visual-1" transform="translate(812,121)">
      <rect width="396" height="238" rx="12" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-principal" transform="translate(152,379)">
      <rect width="656" height="294" rx="12" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
