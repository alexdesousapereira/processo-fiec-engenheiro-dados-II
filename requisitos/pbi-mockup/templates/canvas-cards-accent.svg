<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',system-ui,Inter,sans-serif">
  <!--
    VARIANTE: APP-SHELL (estilo ex.20) — superfície branca com RECORTE (aba) no topo-esquerdo; título em navy na aba.
    Geometria (superfície, sidebar, item ativo) = paths EXATOS do Figma do cliente. Margem 48px · sidebar centro x=100 · cards de x152.
    CORES = paleta padrão: shell navy #14215C (app-shell, sobreposição de backgrounds) + acentos categóricos #F65164/#E0A458/#4E7CFF + gradiente #7033FF→#F65164. Troque pela marca.
    Conteúdo: linha1 (y121, h238) 3 cards-acento w200 (x152/372/592) + wide w396 (x812) · linha2 (y379, h294) wide w656 (x152) + gradiente w380 (x828).
    Filtros: data + 2 (mínimo 2), terminando em x1208 (24px de respiro até a borda da superfície x1232). Ícones assados como path (Figma-safe).
    CAMADAS (Figma): fundo · menu · cabecalho · filtros · kpis · visuais · rodape. Cada kpi-N / visual-N é deletável de uma vez.
  -->

  <g id="fundo">
