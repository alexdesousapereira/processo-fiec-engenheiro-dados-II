<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',system-ui,Inter,sans-serif">
  <!--
    VARIANTE: TOPO DE MARCA (estilo ex.17/18/19) — barra superior full-width branca (logo + cliente + navegação em abas) + faixa de KPIs + 2 bandas largas de conteúdo.
    Os 3 exemplos (17/18/19) são o MESMO layout; o acento magenta foi trocado pela cor de ação da paleta (#4E7CFF, re-skinnável).
    GRID PADRÃO: margem 24 · gutter 20 · conteúdo x24..1256. Barra h60. KPIs (4): w293, x = 24 / 337 / 650 / 963 (y132, h88).
    Bandas largas (w1232): y240 (h196) e y456 (h196). Filtros: data + 2. Ícones Material assados como path (Figma-safe).
    CAMADAS (Figma): fundo · menu · cabecalho · filtros · kpis · visuais · rodape.
  -->

  <g id="fundo">
    <rect width="1280" height="720" fill="#F5F7FB"/>
  </g>

  <!-- BARRA SUPERIOR DE MARCA (logo + cliente + navegação em abas) -->
  <g id="menu">
    <rect x="0" y="0" width="1280" height="60" fill="#FFFFFF"/>
    <rect x="0" y="59" width="1280" height="1" fill="#E6E8EC"/>
    <rect x="24" y="15" width="30" height="30" rx="8" fill="#4E7CFF"/>
    <text x="64" y="36" font-size="16" font-weight="600" fill="#33394C">{{CLIENTE}}</text>
    <text x="260" y="36" font-size="13" font-weight="600" fill="#4E7CFF">{{TELA_ATIVA}}</text>
    <rect x="260" y="46" width="78" height="3" rx="1.5" fill="#4E7CFF"/>
    <text x="372" y="36" font-size="13" fill="#7C8595">{{TELA_2}}</text>
    <text x="476" y="36" font-size="13" fill="#7C8595">{{TELA_3}}</text>
    <rect x="1212" y="16" width="44" height="28" rx="8" fill="#F5F7FB" stroke="#E6E8EC"/>
    <g transform="translate(1224,22) scale(0.016667) translate(0,960)" fill="#5C6470"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm110-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T440-480q0 58 40.5 99t99.5 41Z"/></g>
  </g>

  <g id="cabecalho">
    <text x="24" y="98" font-size="22" font-weight="600" fill="#33394C">{{AREA}} — {{ASSUNTO}}</text>
    <text x="24" y="118" font-size="13" fill="#5C6470">Dados: <tspan font-weight="600" fill="#33394C">{{DATA_REFERENCIA}}</tspan> · atualizado em {{DATA_ATUALIZACAO}}</text>
  </g>

  <g id="filtros" transform="translate(786,82)" font-size="12">
    <g id="filtro-data"><rect x="0"   y="0" width="108" height="26" rx="13" fill="#4E7CFF" fill-opacity="0.12"/><text x="16" y="17" fill="#4E7CFF" font-weight="600">{{MES}}/{{ANO}}</text></g>
    <g id="filtro-1"><rect x="118" y="0" width="114" height="26" rx="6" fill="#FFFFFF" stroke="#E6E8EC"/><text x="130" y="17" fill="#5C6470">{{FILTRO_1}} ▾</text></g>
    <g id="filtro-2"><rect x="242" y="0" width="114" height="26" rx="6" fill="#FFFFFF" stroke="#E6E8EC"/><text x="254" y="17" fill="#5C6470">{{FILTRO_2}} ▾</text></g>
  </g>

  <g id="kpis">
    <g id="kpi-1" transform="translate(24,132)">
      <rect width="293" height="88" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <rect x="16" y="16" width="36" height="36" rx="9" fill="#4E7CFF" fill-opacity="0.12"/>
      <g transform="translate(23,23) scale(0.022917) translate(0,960)" fill="#4E7CFF"><path d="M441-120v-86q-53-12-91.5-46T293-348l74-30q15 48 44.5 73t77.5 25q41 0 69.5-18.5T587-356q0-35-22-55.5T463-458q-86-27-118-64.5T313-614q0-65 42-101t86-41v-84h80v84q50 8 82.5 36.5T651-650l-74 32q-12-32-34-48t-60-16q-44 0-67 19.5T393-614q0 33 30 52t104 40q69 20 104.5 63.5T667-358q0 71-42 108t-104 46v84h-80Z"/></g>
      <text x="62" y="42" font-size="24" font-weight="700" fill="#33394C">{{VALOR}}</text>
      <text x="62" y="60" font-size="11" letter-spacing="1.1" fill="#7C8595">{{ROTULO_KPI}}</text>
      <text x="62" y="78" font-size="12" fill="#2E9E5B">{{CONTEXTO_KPI}}</text>
    </g>
    <!-- repita X = 337 / 650 / 963 -->
  </g>

  <!-- 2 BANDAS LARGAS (full-width) -->
  <g id="visuais">
    <g id="visual-principal" transform="translate(24,240)">
      <rect width="1232" height="196" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="24" y="34" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO_PRINCIPAL}}</text>
      <text x="24" y="52" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-1" transform="translate(24,456)">
      <rect width="1232" height="196" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="24" y="34" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="24" y="52" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
  </g>

  <g id="rodape">
    <text x="24" y="690" font-size="11" fill="#7C8595">Fonte: {{FONTE}}</text>
    <text x="1256" y="690" text-anchor="end" font-size="11" fill="#C9CDD4">MOCKUP — dados ilustrativos</text>
  </g>
</svg>
