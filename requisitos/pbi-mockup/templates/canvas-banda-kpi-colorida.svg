<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',system-ui,Inter,sans-serif">
  <!--
    VARIANTE: BANDA DE KPIs COLORIDA (estilo ex.01) — faixa de 4 KPIs em cartões de cor cheia (não brancos) no topo, corpo branco abaixo.
    GRID PADRÃO: margem 24 · gutter 20 · conteúdo x24..1256.
    Banda KPI (4): w293, x = 24 / 337 / 650 / 963 (y104, h100) — TONS PROFUNDOS p/ texto branco legível (contraste ≥4,5:1, inclusive rótulos pequenos): #2E50C8 #6A2BD9 #B5283C #0E6E62 (troque pela marca, mas mantenha o fundo escuro o bastante sob texto branco — o accent #4E7CFF é claro demais p/ rótulo pequeno branco).
    Corpo (y224, h448): principal w804 (x24) + 2 de apoio w408 (x848, y224 e y462, h214).
    Filtros: data + 2. Ícones Material assados como path (Figma-safe).
    CAMADAS (Figma): fundo · cabecalho · filtros · kpis · visuais · rodape.
  -->

  <g id="fundo">
    <rect width="1280" height="720" fill="#F5F7FB"/>
  </g>

  <g id="cabecalho">
    <text x="24" y="46" font-size="24" font-weight="600" fill="#33394C">{{AREA}} — {{ASSUNTO}}</text>
    <text x="24" y="68" font-size="13" fill="#5C6470">Dados: <tspan font-weight="600" fill="#33394C">{{DATA_REFERENCIA}}</tspan> · atualizado em {{DATA_ATUALIZACAO}}</text>
  </g>

  <g id="filtros" transform="translate(776,28)" font-size="12">
    <g id="filtro-data"><rect x="0"   y="0" width="108" height="26" rx="13" fill="#4E7CFF" fill-opacity="0.12"/><text x="16" y="17" fill="#4E7CFF" font-weight="600">{{MES}}/{{ANO}}</text></g>
    <g id="filtro-1"><rect x="118" y="0" width="114" height="26" rx="6" fill="#FFFFFF" stroke="#E6E8EC"/><text x="130" y="17" fill="#5C6470">{{FILTRO_1}} ▾</text></g>
    <g id="filtro-2"><rect x="242" y="0" width="114" height="26" rx="6" fill="#FFFFFF" stroke="#E6E8EC"/><text x="254" y="17" fill="#5C6470">{{FILTRO_2}} ▾</text></g>
    <g id="filtro-limpar"><text x="372" y="17" fill="#4E7CFF" font-weight="600">✕ Limpar</text></g>
  </g>

  <!-- BANDA DE KPIs COLORIDA (4) — cartões de cor cheia, texto branco -->
  <g id="kpis">
    <g id="kpi-1" transform="translate(24,104)">
      <rect width="293" height="100" rx="12" fill="#2E50C8"/>
      <rect x="16" y="16" width="40" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.20"/>
      <g transform="translate(24,24) scale(0.025000) translate(0,960)" fill="#FFFFFF"><path d="M441-120v-86q-53-12-91.5-46T293-348l74-30q15 48 44.5 73t77.5 25q41 0 69.5-18.5T587-356q0-35-22-55.5T463-458q-86-27-118-64.5T313-614q0-65 42-101t86-41v-84h80v84q50 8 82.5 36.5T651-650l-74 32q-12-32-34-48t-60-16q-44 0-67 19.5T393-614q0 33 30 52t104 40q69 20 104.5 63.5T667-358q0 71-42 108t-104 46v84h-80Z"/></g>
      <text x="68" y="48" font-size="28" font-weight="700" fill="#FFFFFF">{{VALOR}}</text>
      <text x="68" y="66" font-size="11" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.85">{{ROTULO_KPI}}</text>
      <text x="16" y="90" font-size="12" fill="#FFFFFF" fill-opacity="0.92">{{CONTEXTO_KPI}}</text>
    </g>
    <g id="kpi-2" transform="translate(337,104)">
      <rect width="293" height="100" rx="12" fill="#6A2BD9"/>
      <rect x="16" y="16" width="40" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.20"/>
      <g transform="translate(24,24) scale(0.025000) translate(0,960)" fill="#FFFFFF"><path d="M640-160v-280h160v280H640Zm-240 0v-640h160v640H400Zm-240 0v-440h160v440H160Z"/></g>
      <text x="68" y="48" font-size="28" font-weight="700" fill="#FFFFFF">{{VALOR}}</text>
      <text x="68" y="66" font-size="11" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.85">{{ROTULO_KPI}}</text>
      <text x="16" y="90" font-size="12" fill="#FFFFFF" fill-opacity="0.92">{{CONTEXTO_KPI}}</text>
    </g>
    <g id="kpi-3" transform="translate(650,104)">
      <rect width="293" height="100" rx="12" fill="#B5283C"/>
      <rect x="16" y="16" width="40" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.20"/>
      <g transform="translate(24,24) scale(0.025000) translate(0,960)" fill="#FFFFFF"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></g>
      <text x="68" y="48" font-size="28" font-weight="700" fill="#FFFFFF">{{VALOR}}</text>
      <text x="68" y="66" font-size="11" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.85">{{ROTULO_KPI}}</text>
      <text x="16" y="90" font-size="12" fill="#FFFFFF" fill-opacity="0.92">{{CONTEXTO_KPI}}</text>
    </g>
    <g id="kpi-4" transform="translate(963,104)">
      <rect width="293" height="100" rx="12" fill="#0E6E62"/>
      <rect x="16" y="16" width="40" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.20"/>
      <g transform="translate(24,24) scale(0.025000) translate(0,960)" fill="#FFFFFF"><path d="M120-120v-80l80-80v160h-80Zm160 0v-240l80-80v320h-80Zm160 0v-320l80 81v239h-80Zm160 0v-239l80-80v319h-80Zm160 0v-400l80-80v480h-80ZM120-327v-113l280-280 160 160 280-280v113L560-447 400-607 120-327Z"/></g>
      <text x="68" y="48" font-size="28" font-weight="700" fill="#FFFFFF">{{VALOR}}</text>
      <text x="68" y="66" font-size="11" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.85">{{ROTULO_KPI}}</text>
      <text x="16" y="90" font-size="12" fill="#FFFFFF" fill-opacity="0.92">{{CONTEXTO_KPI}}</text>
    </g>
  </g>

  <!-- CORPO branco -->
  <g id="visuais">
    <g id="visual-principal" transform="translate(24,224)">
      <rect width="804" height="448" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="24" y="34" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO_PRINCIPAL}}</text>
      <text x="24" y="52" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-1" transform="translate(848,224)">
      <rect width="408" height="214" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
    <g id="visual-2" transform="translate(848,462)">
      <rect width="408" height="210" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
      <text x="20" y="32" font-size="15" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text>
      <text x="20" y="50" font-size="12" fill="#4E7CFF">{{INSIGHT}}</text>
    </g>
  </g>

  <g id="rodape">
    <text x="24" y="690" font-size="11" fill="#7C8595">Fonte: {{FONTE}}</text>
    <text x="1256" y="690" text-anchor="end" font-size="11" fill="#C9CDD4">MOCKUP — dados ilustrativos</text>
  </g>
</svg>
