    <text x="96" y="262" text-anchor="middle" font-size="10" fill="#4E7CFF">{{TELA_ATIVA}}</text>
    <g transform="translate(84,320) scale(0.025000) translate(0,960)" fill="#FFFFFF"><path d="m612-292 56-56-148-148v-184h-80v216l172 172ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-400Zm0 320q133 0 226.5-93.5T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160Z"/></g>
    <text x="96" y="370" text-anchor="middle" font-size="10" fill="#FFFFFF" fill-opacity="0.85">{{TELA_2}}</text>
  </g>

  <!-- TÍTULO + carimbos -->
  <g id="cabecalho">
    <text x="165" y="82" font-size="11" letter-spacing="1.2" fill="#4E7CFF">{{AREA}}</text>
    <text x="165" y="106" font-size="20" font-weight="700" fill="#33394C">{{ASSUNTO}}</text>
    <text x="165" y="124" font-size="11" fill="#5C6470">Dados: <tspan font-weight="600" fill="#33394C">{{DATA_REFERENCIA}}</tspan> · atual. {{DATA_ATUALIZACAO}}</text>
  </g>

  <!-- FILTROS (pílula ANALISAR + 2 filtros) -->
  <g id="filtros">
    <g id="filtro-data">
      <rect x="485" y="69" width="180" height="45" rx="12" fill="#FFFFFF"/>
      <g transform="translate(501,80) scale(0.022917) translate(0,960)" fill="#4E7CFF"><path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z"/></g>
      <text x="532" y="97" font-size="14" font-weight="600" fill="#33394C">Analisar</text>
    </g>
    <g id="filtro-1">
      <rect x="685" y="69" width="250" height="45" rx="12" fill="#FFFFFF"/><text x="705" y="97" font-size="13" fill="#5C6470">{{FILTRO_1}} ▾</text>
    </g>
    <g id="filtro-2">
      <rect x="955" y="69" width="245" height="45" rx="12" fill="#FFFFFF"/><text x="975" y="97" font-size="13" fill="#5C6470">{{FILTRO_2}} ▾</text>
    </g>
  </g>

