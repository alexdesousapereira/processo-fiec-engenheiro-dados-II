<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',system-ui,Inter,sans-serif">
  <!--
    VARIANTE: SIDEBAR + coluna de KPIs + PAINEL AGRUPADO (container colorido) + faixa inferior. Réplica fiel do exemplo_12.svg (geometria exata).
    Coordenadas do ex.12: KPIs x165 y135/238/341 w277 h83 · turnover x165 y444 277x206 ·
    painel agrupado x462 y50 758x374 rx36 · pílula ANALISAR x485 y69 + 2 filtros · 3 cards x489/732/975 y176 223x222 · faixa x462 y444 736x206.
    Cards brancos = SLOTS de gráfico (deixe vazios; o visual entra por cima no PBIX). Paleta padrão (ação #4E7CFF; troque pela marca). Ícones assados como path.
  -->

  <g id="fundo">
    <rect width="1280" height="720" fill="url(#bg)"/>
    <!-- superfície do painel agrupado (cor de ação) -->
    <rect x="462" y="50" width="758" height="374" rx="36" fill="url(#teal)"/>
  </g>

  <!-- SIDEBAR arredondado (cor de ação) -->
