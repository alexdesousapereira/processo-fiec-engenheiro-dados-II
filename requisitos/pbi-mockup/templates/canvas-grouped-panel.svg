    <g id="kpi-2" transform="translate(165,238)"><rect width="277" height="83" rx="16" fill="#FFFFFF"/><rect x="20" y="22" width="38" height="38" rx="10" fill="#4E7CFF" fill-opacity="0.12"/><g transform="translate(27,29) scale(0.025000) translate(0,960)" fill="#4E7CFF"><path d="M441-120v-86q-53-12-91.5-46T293-348l74-30q15 48 44.5 73t77.5 25q41 0 69.5-18.5T587-356q0-35-22-55.5T463-458q-86-27-118-64.5T313-614q0-65 42-101t86-41v-84h80v84q50 8 82.5 36.5T651-650l-74 32q-12-32-34-48t-60-16q-44 0-67 19.5T393-614q0 33 30 52t104 40q69 20 104.5 63.5T667-358q0 71-42 108t-104 46v84h-80Z"/></g><text x="72" y="42" font-size="22" font-weight="700" fill="#33394C">{{VALOR}}</text><text x="72" y="62" font-size="11" letter-spacing="1" fill="#7C8595">{{ROTULO_KPI}}</text></g>
    <g id="kpi-3" transform="translate(165,341)"><rect width="277" height="83" rx="16" fill="#FFFFFF"/><rect x="20" y="22" width="38" height="38" rx="10" fill="#4E7CFF" fill-opacity="0.12"/><g transform="translate(27,29) scale(0.025000) translate(0,960)" fill="#4E7CFF"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"/></g><text x="72" y="42" font-size="22" font-weight="700" fill="#33394C">{{VALOR}}</text><text x="72" y="62" font-size="11" letter-spacing="1" fill="#7C8595">{{ROTULO_KPI}}</text></g>
  </g>

  <!-- VISUAIS: card inferior esquerdo + painel agrupado + faixa inferior -->
  <g id="visuais">
    <!-- card inferior esquerdo (slot: % turnover) -->
    <g id="visual-1" transform="translate(165,444)"><rect width="277" height="206" rx="16" fill="#FFFFFF"/><text x="20" y="34" font-size="14" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text><text x="20" y="52" font-size="11" fill="#4E7CFF">{{INSIGHT}}</text></g>

    <!-- PAINEL AGRUPADO (cor de ação) com 3 cards da MESMA pergunta · superfície teal em #fundo -->
    <g id="painel">
      <text x="489" y="158" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">{{QUEBRA_1}}</text>
      <text x="732" y="158" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">{{QUEBRA_2}}</text>
      <text x="975" y="158" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">{{QUEBRA_3}}</text>
      <g id="visual-2"><rect x="489" y="176" width="223" height="222" rx="16" fill="#FFFFFF"/></g>
      <g id="visual-3"><rect x="732" y="176" width="223" height="222" rx="16" fill="#FFFFFF"/></g>
      <g id="visual-4"><rect x="975" y="176" width="223" height="222" rx="16" fill="#FFFFFF"/></g>
    </g>

    <!-- FAIXA INFERIOR (slot) -->
    <g id="visual-5" transform="translate(462,444)"><rect width="736" height="206" rx="16" fill="#FFFFFF"/><text x="24" y="34" font-size="14" font-weight="600" fill="#33394C">{{NOME_DESCRITIVO}}</text><text x="24" y="52" font-size="11" fill="#5C6470">{{INSIGHT}}</text></g>
  </g>

  <!-- RODAPÉ -->
  <g id="rodape">
    <text x="165" y="688" font-size="11" fill="#5C6470">Fonte: {{FONTE}} · MOCKUP — dados ilustrativos</text>
  </g>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F5F7FB"/><stop offset="1" stop-color="#EDEFF2"/></linearGradient>
    <!-- superfície de painel/sidebar: azul PROFUNDO p/ texto branco legível (rótulos QUEBRA/nav brancos ≥4,5:1; o accent #4E7CFF é claro demais p/ texto pequeno branco) -->
    <linearGradient id="teal" x1="462" y1="50" x2="1220" y2="424" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2E50C8"/><stop offset="1" stop-color="#2E50C8"/></linearGradient>
  </defs>
</svg>
