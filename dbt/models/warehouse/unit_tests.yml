version: 2

# Testam a regra com linhas escritas à mão, sem depender dos dados carregados.
unit_tests:
  - name: media_ignora_nulos_agregado_e_outros_recortes
    model: fato_producao_fisica_industrial_2025
    description: >
      A média usa só as atividades 3.NN com número, do índice 12606, no nível de UF e em 2025.
    given:
      - input: ref('fat_producao_fisica')
        rows:
          - {territorio_codigo: 23, periodo: 202501, variavel_codigo: 12606, categoria_codigo: 1, valor: 100}
          - {territorio_codigo: 23, periodo: 202501, variavel_codigo: 12606, categoria_codigo: 2, valor: 200}
          # Atividade sem dado na UF: fora da média, e não igual a zero.
          - {territorio_codigo: 23, periodo: 202501, variavel_codigo: 12606, categoria_codigo: 3, valor: null}
          # Agregado "3 Indústrias de transformação": não é atividade.
          - {territorio_codigo: 23, periodo: 202501, variavel_codigo: 12606, categoria_codigo: 9, valor: 999}
          # Outra variável, outro ano e nível Brasil: fora do recorte.
          - {territorio_codigo: 23, periodo: 202501, variavel_codigo: 11602, categoria_codigo: 1, valor: 888}
          - {territorio_codigo: 23, periodo: 202401, variavel_codigo: 12606, categoria_codigo: 1, valor: 777}
          - {territorio_codigo: 1, periodo: 202501, variavel_codigo: 12606, categoria_codigo: 1, valor: 666}
      - input: ref('dim_territorio')
        rows:
          - {territorio_codigo: 23, territorio_nome: Ceará, nivel: N3}
          - {territorio_codigo: 1, territorio_nome: Brasil, nivel: N1}
      - input: ref('dim_categorias')
        rows:
          - {categoria_codigo: 1, categoria_cnae: "3.13", categoria_nome: Têxteis, eh_atividade_transformacao: true}
          - {categoria_codigo: 2, categoria_cnae: "3.24", categoria_nome: Metalurgia, eh_atividade_transformacao: true}
          - {categoria_codigo: 3, categoria_cnae: "3.11", categoria_nome: Bebidas, eh_atividade_transformacao: true}
          - {categoria_codigo: 9, categoria_cnae: "3", categoria_nome: Transformação, eh_atividade_transformacao: false}
      - input: ref('dim_calendario')
        rows:
          - {periodo: 202501, ano: 2025}
          - {periodo: 202401, ano: 2024}
    expect:
      rows:
        # O texto segue a escala que o PostgreSQL devolve para AVG em numeric.
        - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 1, indice_producao: 100, media_atividades_uf_mes: "150.0000000000000000", diferenca_para_media: "-50.0000000000000000"}
        - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 2, indice_producao: 200, media_atividades_uf_mes: "150.0000000000000000", diferenca_para_media: "50.0000000000000000"}

  - name: top3_tem_3_linhas_com_desempate_pelo_codigo
    model: vw_top3_transformacao_2025
    description: Quatro atividades com empate no topo geram 3 linhas, com a de menor código primeiro.
    given:
      - input: ref('fato_producao_fisica_industrial_2025')
        rows:
          - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 7, indice_producao: 100}
          - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 5, indice_producao: 100}
          - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 6, indice_producao: 90}
          - {territorio_codigo: 23, periodo: 202501, categoria_codigo: 8, indice_producao: 80}
      - input: ref('dim_territorio')
        rows:
          - {territorio_codigo: 23, territorio_nome: Ceará}
      - input: ref('dim_categorias')
        rows:
          - {categoria_codigo: 5, categoria_cnae: "3.10", categoria_nome: A}
          - {categoria_codigo: 6, categoria_cnae: "3.11", categoria_nome: B}
          - {categoria_codigo: 7, categoria_cnae: "3.12", categoria_nome: C}
          - {categoria_codigo: 8, categoria_cnae: "3.13", categoria_nome: D}
    expect:
      rows:
        - {atividade_codigo: 5, posicao: 1}
        - {atividade_codigo: 7, posicao: 2}
        - {atividade_codigo: 6, posicao: 3}
